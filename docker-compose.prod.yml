services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takumipay-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://takumipay:${POSTGRES_PASSWORD:-takumipay-123}@postgres:5432/takumipay
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      VALKEY_REQUEST_TIMEOUT: 5000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME:-90D}
      REFRESH_TOKEN_EXPIRATION_TIME: ${REFRESH_TOKEN_EXPIRATION_TIME:-200D}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCK_DURATION_MINUTES: ${ACCOUNT_LOCK_DURATION_MINUTES:-30}
      NONCE_EXPIRE_TIME_MINUTES: ${NONCE_EXPIRE_TIME_MINUTES:-5}
      SIWE_DOMAIN: ${SIWE_DOMAIN}
      SIWE_URI: ${SIWE_URI}
      SIWE_STATEMENT: ${SIWE_STATEMENT:-Sign in to TakumiPay}
      ADMIN_WALLET_PRIVATE_KEY: ${ADMIN_WALLET_PRIVATE_KEY}
      CHAIN_ID: ${CHAIN_ID:-1}
      MIN_CONFIRMATIONS: ${MIN_CONFIRMATIONS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.takumipay.com}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      VCGAMERS_SECRET: ${VCGAMERS_SECRET}
      CORE_PAYMENT_API_URL: ${CORE_PAYMENT_API_URL}
      CORE_PAYMENT_API_TIMEOUT: ${CORE_PAYMENT_API_TIMEOUT:-60000}
      CORE_PAYMENT_API_RETRY_COUNT: ${CORE_PAYMENT_API_RETRY_COUNT:-3}
      # TakumiPay signed-QR private signing key (ES256 P-256). Single-line
      # PEM with literal \n escapes — the loader normalizes them. Without
      # this var the merchant signup endpoint returns 503.
      TAKUMIPAY_QR_PRIVATE_KEY_PEM: ${TAKUMIPAY_QR_PRIVATE_KEY_PEM}
      TAKUMIPAY_QR_KID: ${TAKUMIPAY_QR_KID:-2026-04-20}
      PAYMENT_SETTLEMENT_RAIL: ${PAYMENT_SETTLEMENT_RAIL:-takumipay}
      # EVM settlement
      EVM_QUOTE_SIGNER_PRIVATE_KEY: ${EVM_QUOTE_SIGNER_PRIVATE_KEY}
      PLATFORM_TREASURY_ADDRESS_EVM: ${PLATFORM_TREASURY_ADDRESS_EVM}
      ARC_SETTLER_PRIVATE_KEY: ${ARC_SETTLER_PRIVATE_KEY}
      # SVM settlement
      SVM_SETTLER_PRIVATE_KEY: ${SVM_SETTLER_PRIVATE_KEY}
      PLATFORM_TREASURY_ADDRESS_SVM: ${PLATFORM_TREASURY_ADDRESS_SVM}
      SOLANA_QUOTE_SIGNER_PRIVATE_KEY: ${SOLANA_QUOTE_SIGNER_PRIVATE_KEY}
      # Circle x402
      CIRCLE_X402_SUPPORTED_URL: ${CIRCLE_X402_SUPPORTED_URL}
      CIRCLE_API_KEY: ${CIRCLE_API_KEY}
      # Valkey auth
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      # Rate limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      BOOKING_RATE_LIMIT_WINDOW_MINUTES: ${BOOKING_RATE_LIMIT_WINDOW_MINUTES:-15}
      BOOKING_RATE_LIMIT_MAX_REQUESTS: ${BOOKING_RATE_LIMIT_MAX_REQUESTS:-10}
      # Google OAuth
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID}
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB}
      # Payouts
      DEFAULT_PAYOUT_PROVIDER: ${DEFAULT_PAYOUT_PROVIDER:-xendit}
      XENDIT_API_BASE: ${XENDIT_API_BASE}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
      # Duitku payouts
      DUITKU_DISB_USER_ID: ${DUITKU_DISB_USER_ID}
      DUITKU_DISB_EMAIL: ${DUITKU_DISB_EMAIL}
      DUITKU_DISB_SECRET_KEY: ${DUITKU_DISB_SECRET_KEY}
      DUITKU_DISB_API_BASE: ${DUITKU_DISB_API_BASE}
      # Flip payouts
      FLIP_SECRET_KEY: ${FLIP_SECRET_KEY}
      FLIP_VALIDATION_TOKEN: ${FLIP_VALIDATION_TOKEN}
      FLIP_API_BASE: ${FLIP_API_BASE}
      # Onchain settlement
      ONCHAIN_MIN_CONFIRMATIONS: ${ONCHAIN_MIN_CONFIRMATIONS}
      QUOTE_TTL_DIRECT_ARC_SECONDS: ${QUOTE_TTL_DIRECT_ARC_SECONDS:-900}
      QUOTE_SIGNATURE_DOMAIN_NAME: ${QUOTE_SIGNATURE_DOMAIN_NAME:-TakumiPay}
      QUOTE_SIGNATURE_DOMAIN_VERSION: ${QUOTE_SIGNATURE_DOMAIN_VERSION:-1}
      # NATS (optional)
      NATS_SERVERS: ${NATS_SERVERS}
      NATS_USER: ${NATS_USER}
      NATS_PASS: ${NATS_PASS}
      # Request size
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-10mb}
      # DeFi Strategies — API keys
      ZERION_API_KEY: ${ZERION_API_KEY}
      DEBANK_API_KEY: ${DEBANK_API_KEY}
      DEFILLAMA_API_KEY: ${DEFILLAMA_API_KEY}
      LIFI_API_KEY: ${LIFI_API_KEY}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-takumipay}
      # DeFi Strategies — base URLs (required at startup)
      DEFILLAMA_YIELDS_URL: ${DEFILLAMA_YIELDS_URL:-https://yields.llama.fi}
      DEFILLAMA_API_URL: ${DEFILLAMA_API_URL:-https://api.llama.fi}
      DEFILLAMA_PRO_URL: ${DEFILLAMA_PRO_URL:-https://pro-api.llama.fi}
      LIFI_API_URL: ${LIFI_API_URL:-https://li.quest/v1}
      ZERION_API_URL: ${ZERION_API_URL:-https://api.zerion.io/v1}
      DEBANK_API_URL: ${DEBANK_API_URL:-https://api.cloud.debank.com/v1}
      # DeFi Strategies — worker toggles & budgets
      DEFI_WORKERS_ENABLED: ${DEFI_WORKERS_ENABLED:-true}
      DEFI_STABLECOIN_DEPEG_THRESHOLD_BPS: ${DEFI_STABLECOIN_DEPEG_THRESHOLD_BPS:-50}
      DEFI_ZERION_DAILY_BUDGET_REQUESTS: ${DEFI_ZERION_DAILY_BUDGET_REQUESTS:-1000}
      DEFI_DEBANK_DAILY_BUDGET_CENTS: ${DEFI_DEBANK_DAILY_BUDGET_CENTS:-500}
      DEFI_AUTO_COMPOUND_INTERVAL_DAYS: ${DEFI_AUTO_COMPOUND_INTERVAL_DAYS:-7}
      # Push notifications (Expo Push) — leave blank for free anonymous relay
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - takumipay-network

  postgres:
    image: timescale/timescaledb-ha:pg18
    container_name: takumipay-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: takumipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takumipay-123}
      POSTGRES_DB: takumipay
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takumipay -d takumipay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - takumipay-network

  valkey:
    image: valkey/valkey:9-alpine
    container_name: takumipay-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - takumipay-network

volumes:
  postgres_data:
  valkey_data:

networks:
  takumipay-network:
    driver: bridge
